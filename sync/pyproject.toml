[project]
name = "bifrost-sync"
version = "0.0.0" # placeholder; release version stamped from the git tag in CI
description = "Bifrost live sync: datafordeler fetch -> dlt staging -> generation snapshots"
requires-python = ">=3.13,<3.14"
dependencies = [
    "bifrost",                     # shared: normalizer, schema.sql, generations, column tuples
    "dlt[postgres]>=1.30.0",        # staging merges; 1.27.x yanked for a merge data-loss bug
    "asyncpg>=0.31",               # reuses the asyncpg-typed bifrost.db.generations
    "psycopg2-binary>=2.9",        # sync advisory lock + status: one blocking conn spans the run
    "shapely>=2.0",                # snapshot-time point-in-polygon district stamping
    "python-dotenv>=1.2.2",        # dev: autoload app/.env creds + dsn
]

[project.scripts]
bifrost-sync = "bifrost_sync.cli:main"

[tool.uv.sources]
bifrost = { workspace = true }

[build-system]
requires = ["hatchling>=1.30"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bifrost_sync"]
