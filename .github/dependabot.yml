version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # workspace members; "bifrost" is also a real pypi name
      - dependency-name: "bifrost*"
      # 1.29 segfaults importing its pybind ext under the distroless runtime
      - dependency-name: "onnxruntime"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "npm"
    directories: ["/ui", "/docs"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
        group-by: "dependency-name"

  # unfiltered: digest bumps on an unchanged tag carry no semver level
  - package-ecosystem: "docker"
    directories: ["/app", "/sync", "/ui", "/docs"]
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      images:
        patterns: ["*"]
        group-by: "dependency-name"
    ignore:
      # distroless runtime is debian13 == python 3.13
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
    groups:
      compose:
        patterns: ["*"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
