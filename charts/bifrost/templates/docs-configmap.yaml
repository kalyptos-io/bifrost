{{- if .Values.docs.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bifrost.docs.fullname" . }}
  labels:
    {{- include "bifrost.docs.labels" . | nindent 4 }}
data:
  # "" -> relative same-origin (docs behind the same ingress host as the api)
  env.js: |
    window.__BIFROST_API__ = {{ .Values.docs.apiBase | quote }};
{{- end }}
