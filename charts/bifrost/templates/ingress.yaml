{{- if and .Values.app.enabled .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bifrost.fullname" . }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- if $.Values.docs.enabled }}
          - path: {{ $.Values.docs.basePath }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "bifrost.docs.fullname" $ }}
                port:
                  name: http
          {{- end }}
          {{- if $.Values.ui.enabled }}
          {{/* api paths stay on the app service; longest-prefix beats the / -> ui catch-all */}}
          {{- range $.Values.ingress.apiPaths }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "bifrost.fullname" $ }}
                port:
                  name: http
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "bifrost.ui.fullname" $ }}
                port:
                  name: http
          {{- else }}
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "bifrost.fullname" $ }}
                port:
                  name: http
          {{- end }}
          {{- end }}
    {{- end }}
{{- end }}
