{{- if .Values.docs.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bifrost.docs.fullname" . }}
  labels:
    {{- include "bifrost.docs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.docs.service.type }}
  selector:
    {{- include "bifrost.docs.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.docs.service.port }}
      targetPort: http
      protocol: TCP
{{- end }}
