{{- if and .Values.app.enabled (not .Values.database.existingSecret) }}
{{- if not .Values.database.dsn }}
{{- fail "set database.dsn (chart makes a Secret) or database.existingSecret" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "bifrost.fullname" . }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.dsn | quote }}
{{- end }}
