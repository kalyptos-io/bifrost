server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off; # behind tls termination: an absolute one would leak http://host:8080

    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json text/css image/svg+xml;

    # locations are regex: the site lives under a build-time base, unknown here
    location ~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~ /env\.js$ {
        add_header Cache-Control "no-store";
    }

    location ~ \.html$ {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
